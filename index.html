<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¿A poco sí te gusto?</title>
    <!-- Enlace a la CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/canvas-confetti/1.6.0/confetti.browser.min.js"></script>
    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="css/style.css"> 
    <!-- Ícono -->
    <link rel="Icon" href="images/teddy-bear.png" type="images/png">
</head>
<body>
    <div class="hearts"></div>
    <div class="container">
        <!-- Paso 1 -->
        <div class="step active" id="step1">
            <img src="images/step2.gif" alt="Osito tierno" class="bear-img">
            <h1>Isabela, ¿te gusto? 💝</h1>
            <div class="buttons">
                <button class="btn btn-yes" onclick="goToStep2()">Sí</button>
                <button class="btn btn-no" onmouseover="moveButton(this)" onclick="moveButton(this)">No</button>
            </div>
        </div>

        <!-- Paso 2 -->
        <div class="step" id="step2">
            <img src="images/dudu-twisting-dance.gif" alt="Osito tierno con corazones" class="bear-img">
            <h1>¿Estás segura de que te gusto? 💕</h1>
            <div class="buttons">
                <button class="btn btn-yes" onclick="goToStep3()">Sí, completamente segura</button>
                <button class="btn btn-no" onmouseover="moveButton(this)" onclick="moveButton(this)">Déjame pensarlo...</button>
            </div>
        </div>

        <!-- Paso 3 -->
        <div class="step" id="step3">
            <img src="images/step22.gif" alt="Osito enamorado" class="bear-img">
            <h1>Prométeme que siempre me amaras ❤️</h1>
            <div class="buttons">
                <button class="btn btn-yes" onclick="finalStep()">Sí, lo prometo</button>
            </div>
        </div>

        <!-- Mensaje final -->
        <div class="final-message">
            <img src="images/stafford-matt-unscreen.gif" alt="Osito enamorado" class="bear-img">
            <p>¡Yujuuu! ¡Te quiero muchísimo! 🥰</p>
        </div>
    </div>

    <!-- Código JavaScript -->
    <script src="js/script.js"></script>
</body>
</html>
